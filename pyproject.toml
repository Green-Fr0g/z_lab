[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "z_lab"
version = "0.1.0"
description = "Isaac Lab environments for z_lab."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "zhangyuheng" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[rsl-rl]==3.0.0",
    "rsl-rl-lib==5.5.1",
]

[project.entry-points."isaaclab.tasks"]
z_lab = "z_lab.tasks"

[project.optional-dependencies]
all = ["isaaclab[all]==3.0.0"]
dev = ["isaaclab[dev]==3.0.0"]
importers = ["isaaclab[importers]==3.0.0"]
isaacsim = ["isaaclab[isaacsim]==3.0.0"]
leapp = ["isaaclab[leapp]==3.0.0"]
mimic = ["isaaclab[mimic]==3.0.0"]
ov = ["isaaclab[ov]==3.0.0"]
ovphysx = ["isaaclab[ovphysx]==3.0.0"]
ovrtx = ["isaaclab[ovrtx]==3.0.0"]
rerun = ["isaaclab[rerun]==3.0.0"]
# RL-Games is not included in the published Isaac Lab extras.
rl-games = [
    "aiohttp>=3.14.1",
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@5cf4f9ff07e9a01bbefd167cf19b6804b294b51c",
    "gym",
    "standard-distutils",
]
rlinf = ["isaaclab[rlinf]==3.0.0"]
rsl-rl = ["isaaclab[rsl-rl]==3.0.0"]
sb3 = ["isaaclab[sb3]==3.0.0"]
skrl = ["isaaclab[skrl]==3.0.0"]
teleop = ["isaaclab[teleop]==3.0.0"]
test = ["isaaclab[test]==3.0.0"]
tetrahedralization = ["isaaclab[tetrahedralization]==3.0.0"]
torchrl = ["isaaclab[torchrl]==3.0.0"]
video = ["isaaclab[video]==3.0.0"]
viser = ["isaaclab[viser]==3.0.0"]
wandb = ["isaaclab[wandb]==3.0.0"]

[dependency-groups]
dev = ["codespell>=2.4", "pre-commit>=4.2", "pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Match the resolver overrides shipped with the Isaac Lab 3.0.0 wheel.
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]

[tool.uv.sources]
"omniverseclient" = { index = "pypi-public" }
"ovphysx" = { index = "pypi-public" }
"ovrtx" = { index = "pypi-public" }
"ovstage" = { index = "pypi-public" }
"torch" = { index = "pytorch-cu130" }
"torchaudio" = { index = "pytorch-cu130" }
"torchvision" = { index = "pytorch-cu130" }
"rsl-rl-lib" = { path = "src/rsl_rl", editable = true }

[tool.uv.build-backend]
module-name = "z_lab"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["z_lab"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/__init__.pyi" = ["F401", "F403"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", "**/logs", ".git", ".venv", ".vscode"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: test exercises isolated logic and does not launch the simulator",
    "integration: test drives the simulator/scene/environment end-to-end",
    "smoke: tests for core installation, task, and RL functionality",
    "kitless: test must pass inside the Kit-less container, which has no Isaac Sim runtime",
]

[tool.codespell]
skip = "*.usd,*.usda,*.usdc,*.json,*.onnx,*.pt,*.mp4,*.data,uv.lock,logs"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
