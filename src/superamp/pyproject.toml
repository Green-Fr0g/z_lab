[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "z-lab-superamp"
version = "0.1.0"
description = "World-model and AMP policy training for z_lab tasks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab==3.0.0",
    "numpy",
    "onnx>=1.14",
    "rsl-rl-lib==5.5.1",
    "tensorboard",
    "tensordict>=0.7",
    "torch>=2.11",
    "usd-exchange>=3.0.1",
]

[tool.uv.build-backend]
module-name = "superamp"
module-root = ""
